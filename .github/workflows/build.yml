name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Ekstrak proyek
        run: unzip -q VoluMin.zip

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang Android SDK 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Build debug APK
        run: gradle -p VoluMin assembleDebug --no-daemon

      - uses: actions/upload-artifact@v5
        with:
          name: VoluMin-debug-apk
          path: VoluMin/app/build/outputs/apk/debug/app-debug.apk
